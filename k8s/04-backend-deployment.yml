apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-backend-deployment
  namespace: trendify
  labels:
    app: ecommerce-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-backend
  template:
    metadata:
      labels:
        app: ecommerce-backend
    spec:
      containers:
      - name: ecommerce-backend
        image: onkar1817/trendify-ecommerce-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
          - name: PORT
            valueFrom:
              configMapKeyRef:
                name: ecommerce-configmap
                key: PORT

          - name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ecommerce-secrets
                key: MONGO_INITDB_ROOT_PASSWORD

          - name: MONGO_INITDB_ROOT_USERNAME
            valueFrom:
              configMapKeyRef:
                name: ecommerce-configmap
                key:  MONGO_INITDB_ROOT_USERNAME

          - name: MONGO_INITDB_DATABASE
            valueFrom:
              configMapKeyRef:
                name: ecommerce-configmap
                key: MONGO_INITDB_DATABASE

          - name: MONGO_URI
            value: mongodb://$(MONGO_INITDB_ROOT_USERNAME):$(MONGO_INITDB_ROOT_PASSWORD)@mongodb:27017/$(MONGO_INITDB_DATABASE)?authSource=admin
        resources:
          requests: # minimum resource requirement
            cpu: 100m
            memory: 128Mi

          limits: # maximum resource requirement
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000

        readinessProbe:
          httpGet:
            path: /health
            port: 5000

