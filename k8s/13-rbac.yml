apiVersion: v1
kind: ServiceAccount
metadata:
  name: trendify-viewer
  namespace: trendify
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trendify-pod-viewer-role
  namespace: trendify
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["pods"]
  verbs: ["get", "list", "watch"] # Allows viewing pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trendify-viewer-binding
  namespace: trendify
subjects:
- kind: ServiceAccount
  name: trendify-viewer
  namespace: trendify
roleRef:
  kind: Role
  name: trendify-pod-viewer-role
  apiGroup: rbac.authorization.k8s.io

